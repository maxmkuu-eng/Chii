plugins { id 'com.android.application' }

android {
    namespace 'com.mkuu.ai'
    compileSdk 35

    defaultConfig {
        applicationId 'com.mkuu.ai'
        minSdk 24
        // Keep the WebView app out of Android 15's enforced edge-to-edge
        // mode. The website already owns its own viewport/layout.
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            // Use the runner's standard debug keystore so the generated
            // release APK is signed and directly installable for testing.
            signingConfig signingConfigs.debug
        }
    }
}
