name: Build MKUU AI Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon

      - name: Verify APK
        run: |
          test -f app/build/outputs/apk/release/app-release-unsigned.apk
          unzip -l app/build/outputs/apk/release/app-release-unsigned.apk | grep -E 'AndroidManifest.xml|classes.dex|resources.arsc'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mkuu-ai-release-apk
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
